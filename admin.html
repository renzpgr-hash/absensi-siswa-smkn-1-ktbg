<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Absensi SMK</title>
    
    <!-- PROTEKSI ADMIN PANEL (Wajib di paling atas head) -->
    <script>
        const isLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';
        const loginTime = localStorage.getItem('adminLoginTime');
        // Session berlaku 24 jam
        const isSessionValid = loginTime && (new Date() - new Date(loginTime)) < (24 * 60 * 60 * 1000);
        
        if (!isLoggedIn || !isSessionValid) {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminLoginTime');
            window.location.href = 'login.html';
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-school"></i>
                <h2>Admin Panel</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-tab="dashboard">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="#" class="nav-item" data-tab="attendance">
                    <i class="fas fa-clipboard-list"></i> Data Absensi
                </a>
                <a href="#" class="nav-item" data-tab="photos">
                    <i class="fas fa-images"></i> Foto Bukti
                </a>
                <a href="#" class="nav-item" data-tab="settings">
                    <i class="fas fa-cog"></i> Pengaturan
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header dengan Tombol Logout -->
            <header class="admin-header">
                <h1>Dashboard Admin</h1>
                <div class="admin-info">
                    <span>Administrator</span>
                    <i class="fas fa-user-circle"></i>
                    <button onclick="logout()" style="margin-left: 1rem; background: var(--accent); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 600;">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </header>

            <!-- Dashboard Tab -->
            <div id="dashboardTab" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue"><i class="fas fa-users"></i></div>
                        <div class="stat-info">
                            <h3>Total Siswa</h3>
                            <p class="stat-number" id="totalStudents">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
                        <div class="stat-info">
                            <h3>Hadir Hari Ini</h3>
                            <p class="stat-number" id="todayAttendance">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange"><i class="fas fa-clock"></i></div>
                        <div class="stat-info">
                            <h3>Terlambat</h3>
                            <p class="stat-number" id="lateCount">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red"><i class="fas fa-times-circle"></i></div>
                        <div class="stat-info">
                            <h3>Tidak Hadir</h3>
                            <p class="stat-number" id="absentCount">0</p>
                        </div>
                    </div>
                </div>
                <div class="chart-section">
                    <h2>Grafik Kehadiran Minggu Ini</h2>
                    <div class="chart-placeholder"><canvas id="attendanceChart"></canvas></div>
                </div>
            </div>

            <!-- Attendance Tab -->
            <div id="attendanceTab" class="tab-content">
                <div class="table-header">
                    <h2>Data Absensi</h2>
                    <div class="filter-controls">
                        <input type="date" id="filterDate">
                        <select id="filterClass">
                            <option value="">Semua Kelas</option>
                            <option value="X RPL 1">X RPL 1</option>
                            <option value="X RPL 2">X RPL 2</option>
                            <option value="XI RPL 1">XI RPL 1</option>
                            <option value="XI RPL 2">XI RPL 2</option>
                            <option value="XII RPL 1">XII RPL 1</option>
                            <option value="XII RPL 2">XII RPL 2</option>
                        </select>
                        <button onclick="exportData()" class="btn-export">
                            <i class="fas fa-download"></i> Export
                        </button>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama</th>
                                <th>Kelas</th>
                                <th>Waktu</th>
                                <th>Status</th>
                                <th>Foto</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Photos Tab -->
            <div id="photosTab" class="tab-content">
                <h2>Foto Bukti Kehadiran</h2>
                <div class="photos-grid" id="photosGrid"></div>
            </div>

            <!-- Settings Tab -->
            <div id="settingsTab" class="tab-content">
                <h2>Pengaturan Sistem</h2>
                <div class="settings-form">
                    <div class="input-group">
                        <label>Jam Masuk Sekolah</label>
                        <input type="time" id="schoolStartTime" value="07:00">
                    </div>
                    <div class="input-group">
                        <label>Batas Waktu Toleransi (menit)</label>
                        <input type="number" id="toleranceTime" value="15">
                    </div>
                    <div class="input-group">
                        <label>SSID WiFi Sekolah</label>
                        <input type="text" id="schoolWiFi" value="SMK-WIFI">
                    </div>
                    <button onclick="saveSettings()" class="btn-save">Simpan Pengaturan</button>
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
    
    <!-- Script Tambahan untuk Logout & Settings -->
    <script>
        function logout() {
            if (confirm('Yakin ingin keluar dari admin panel?')) {
                localStorage.removeItem('adminLoggedIn');
                localStorage.removeItem('adminLoginTime');
                window.location.href = 'login.html';
            }
        }

        function saveSettings() {
            const settings = {
                schoolStartTime: document.getElementById('schoolStartTime').value,
                toleranceTime: document.getElementById('toleranceTime').value,
                schoolWiFi: document.getElementById('schoolWiFi').value
            };
            localStorage.setItem('attendanceSettings', JSON.stringify(settings));
            alert('Pengaturan berhasil disimpan!');
        }

        // Load settings saat halaman dimuat
        window.addEventListener('load', function() {
            const settings = JSON.parse(localStorage.getItem('attendanceSettings') || '{}');
            if (settings.schoolStartTime) document.getElementById('schoolStartTime').value = settings.schoolStartTime;
            if (settings.toleranceTime) document.getElementById('toleranceTime').value = settings.toleranceTime;
            if (settings.schoolWiFi) document.getElementById('schoolWiFi').value = settings.schoolWiFi;
        });
    </script>
</body>
</html>
