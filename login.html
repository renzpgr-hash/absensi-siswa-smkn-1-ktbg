<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Absensi SMK</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-light); }
        .login-container { background: white; padding: 3rem; border-radius: 8px; box-shadow: var(--shadow); border: 3px solid var(--primary); width: 100%; max-width: 400px; }
        .login-container h2 { text-align: center; color: var(--primary); margin-bottom: 2rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .input-group input { width: 100%; padding: 0.8rem; border: 2px solid var(--border-color); border-radius: 4px; font-size: 1rem; }
        .btn-login { width: 100%; padding: 1rem; background: var(--primary); color: white; border: 3px solid var(--primary); border-radius: 4px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .btn-login:hover { background: var(--secondary); transform: translateY(-2px); }
        .error-msg { color: var(--accent); text-align: center; margin-top: 1rem; display: none; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body>
    <div class="login-container">
        <h2><i class="fas fa-lock"></i> Login Admin</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Masukkan username">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            <button type="submit" class="btn-login">Masuk</button>
            <p class="error-msg" id="errorMsg">Username atau password salah!</p>
        </form>
    </div>

    <script>
        // ⚠️ GANTI PASSWORD INI SEBELUM DEPLOY!
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'smkn1katibung2026';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminLoginTime', new Date().toISOString());
                window.location.href = 'admin.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
                this.style.animation = 'shake 0.5s';
                setTimeout(() => this.style.animation = '', 500);
            }
        });
    </script>
</body>
</html>
